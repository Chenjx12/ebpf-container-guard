name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests (BPF-free)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies (runtime pinned + test-only deps)
        # httpx2 非拼写错误: starlette>=1.0 testclient 主后端已迁移为 httpx2
        # (fastapi TestClient 用它; 若改回 httpx 会触发 starlette 弃用警告)
        run: |
          pip install -r requirements.txt httpx2==2.10.0 streamlit==1.61.1 pytest
      # v0.6.6: 三步统一走 Makefile target，与本地 `make ci` 共用同一套命令，
      # 避免"本地绿了云上红"。改 CI 步骤时先改 Makefile。
      - name: Run unit tests
        run: make test-unit
      - name: Syntax check (guard + panel)
        run: make syntax
      - name: Check configmap rules drift (H3)
        run: make check-configmap
name: Release

# 决策 #48 教训在 workflow 里固化：
#   - tag 存在 ≠ release 已发 — 本 job 用 action-gh-release 发 release
#   - 发完由 owner 确认 published_at 存在（人工收尾）
# 镜像 tag 对齐 git tag: ghcr.io/<repo>:v0.6.x

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build image + scan + SBOM + GHCR push + release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (GITHUB_TOKEN, no external creds)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Trivy vulnerability scan (fail on CRITICAL/HIGH, ignore unfixed)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: SBOM (cyclonedx, attaches to release)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: cyclonedx
          output: sbom.${{ github.ref_name }}.cdx.json

      - name: Trivy full report (json, attaches to release)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          format: json
          output: trivy-report.${{ github.ref_name }}.json

      - name: GitHub Release (决策 #48: 发完确认 published_at)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.${{ github.ref_name }}.cdx.json
            trivy-report.${{ github.ref_name }}.json
          generate_release_notes: true
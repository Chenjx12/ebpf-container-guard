name: Release

# 决策 #48 教训在 workflow 里固化：
#   - tag 存在 ≠ release 已发 — 本 job 用 action-gh-release 发 release
#   - 发完由 owner 确认 published_at 存在（人工收尾）
# 镜像 tag 对齐 git tag: ghcr.io/<repo>:v0.6.x
# v0.6.2（ADR-049）双证据链：镜像层 trivy + 依赖层 trivy fs（vuln,secret），
#   各自独立门槛（CRITICAL/HIGH + ignore-unfixed），json 报告随 release 附件

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    name: Build image + 2-layer scan + SBOM + GHCR push + release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase GHCR repo (docker tag requires lowercase)
        run: |
          echo "GHCR_REPO=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "GHCR_REPO=$GHCR_REPO"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (GITHUB_TOKEN, no external creds)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_REPO }}:${{ github.ref_name }}
            ${{ env.GHCR_REPO }}:latest

      - name: Trivy vulnerability scan (fail on CRITICAL/HIGH, ignore unfixed)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GHCR_REPO }}:${{ github.ref_name }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: SBOM (cyclonedx, attaches to release)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GHCR_REPO }}:${{ github.ref_name }}
          format: cyclonedx
          output: sbom.${{ github.ref_name }}.cdx.json

      - name: Trivy full report (json, attaches to release)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.GHCR_REPO }}:${{ github.ref_name }}
          format: json
          output: trivy-report.${{ github.ref_name }}.json

      # ---- v0.6.2 (ADR-049): dependency-layer scan (repo: requirements.txt/Dockerfile/sources) ----
      - name: Trivy dependency scan (fs, gate CRITICAL/HIGH, skip .git)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: .git
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Trivy dependency report (json, attaches to release)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: .git
          format: json
          output: trivy-fs-report.${{ github.ref_name }}.json

      - name: GitHub Release (决策 #48: 发完确认 published_at)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.${{ github.ref_name }}.cdx.json
            trivy-report.${{ github.ref_name }}.json
            trivy-fs-report.${{ github.ref_name }}.json
          generate_release_notes: true
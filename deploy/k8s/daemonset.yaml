# eBPF Container Guard — DaemonSet (v0.5.3; 镜像 tag 注释 v0.6.4 修正)
#
# 集群部署形态 (与 deploy/systemd/ 单机形态互斥, 见 ADR-039 单实例锁)。
# 部署:
#   # 本地 k3s e2e: 先构建并导入镜像 (tag 与下方 image 一致)
#   docker build --network host -f deploy/Dockerfile.guard -t ebpf-guard:v0.5.6-fix .
#   docker save ebpf-guard:v0.5.6-fix | sudo k3s ctr images import -
#   kubectl apply -f deploy/k8s/
#   # 生产/多节点: 从 registry 拉取 — 改 image 为
#   #   ghcr.io/chenjx12/ebpf-container-guard:<git-tag> (tag 对齐 git tag,
#   #   见 docs/镜像发布策略.md), 并同步改 imagePullPolicy: IfNotPresent。
#   #   私有 GHCR 需 registry 认证 (k3s /etc/rancher/k3s/registries.yaml)。
# 关键挂载:
#   /sys   — 宿主全 sysfs (BTF + cgroup + tracefs 一次覆盖)
#   /var/lib/ebpf-guard — 日志持久化 (events/decisions/behaviors)
#   configMap — 规则/响应/监控配置
# hostPID: true — guard 读 /proc/<pid>/cgroup 做身份解析 + 宿主 PID
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ebpf-guard
  namespace: kube-system
  labels:
    app: ebpf-guard
spec:
  selector:
    matchLabels:
      app: ebpf-guard
  template:
    metadata:
      labels:
        app: ebpf-guard
    spec:
      serviceAccountName: ebpf-guard
      hostPID: true
      # v0.5.4: hostNetwork 共享宿主 netns — 容器内 iptables 直接操作宿主
      # FORWARD 链断 Pod 流量 (isolate 真实生效, 非降级)
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: guard
          image: ebpf-guard:v0.5.6-fix
          imagePullPolicy: Never
          securityContext:
            # privileged/CAP_SYS_ADMIN 是 CO-RE 加载硬前提 (2026-09 沙箱实测:
            # 无 CAP_SYS_ADMIN 的容器内 libbpf 自检即被拒, main.py 止于
            # [1/8] bpf_object__load errno=1/EPERM; 镜像已内置 vendored libbpf1.8,
            # host 直跑替代装法见 deploy/Dockerfile.guard 装载备忘)
            privileged: true
            capabilities:
              add:
                - CAP_BPF
                - CAP_SYS_ADMIN
                - CAP_NET_ADMIN
                - CAP_SYS_PTRACE
          command:
            - /bin/sh
            - -c
            - >
              exec python3 -u main.py --runtime k8s
          env:
            # v0.5.5: 本地时区 — 事件时间戳与宿主对齐 (容器默认 UTC 偏差 8h)
            - name: TZ
              value: Asia/Shanghai
            # v0.5.5: 自豁免需知自身 pod 名 (hostNetwork 下 HOSTNAME env 是节点名)
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # v0.5.6: AI key 从 Secret 注入 (不进 configmap/git)
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ebpf-guard-ai
                  key: api_key
          volumeMounts:
            - name: sysfs
              mountPath: /sys
            - name: guard-logs
              mountPath: /app/logs
            - name: guard-config
              mountPath: /app/config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: sysfs
          hostPath:
            path: /sys
        - name: guard-logs
          hostPath:
            path: /var/lib/ebpf-guard
            type: DirectoryOrCreate
        - name: guard-config
          configMap:
            name: ebpf-guard-config
# eBPF Container Guard — Detection Rules (v0.2.0)
# 8 rules covering mount / ptrace / execve / connect / openat

rules:
  # ============================================================
  # mount 探针 — 文件系统挂载攻击
  # ============================================================

  - name: "procfs_mount_escape"
    description: "检测容器内挂载宿主机 procfs 文件系统"
    attack_vector: "procfs_mount"
    severity: "CRITICAL"
    condition:
      event_type: "mount"
      fstype: "proc"
    exclude:
      comm:
        - "dockerd"
        - "containerd"
        - "runc:[2:INIT]"
        - "runc"
        - "docker-proxy"
      target_path:
        - "/proc/thread-self/fd/*"
    cve_refs:
      - "CVE-2019-5736"
      - "CVE-2019-16884"
      - "CVE-2020-15257"
    action: "alert_and_log"

  - name: "docker_socket_mount"
    description: "检测容器内挂载 Docker socket（容器逃逸前置步骤）"
    attack_vector: "docker_socket_mount"
    severity: "CRITICAL"
    condition:
      event_type: "mount"
      target_path:
        - "/var/run/docker.sock"
        - "/run/docker.sock"
    cve_refs:
      - "CVE-2019-5736"
    action: "alert_and_log"

  # ============================================================
  # ptrace 探针 — 进程注入攻击
  # ============================================================

  - name: "ptrace_host_init"
    description: "检测容器内 ptrace 宿主机 1 号进程(systemd/init)"
    attack_vector: "ptrace_host_init"
    severity: "HIGH"
    condition:
      event_type: "ptrace"
      target_pid: 1
    cve_refs:
      - "CVE-2019-16884"
      - "CVE-2022-0492"
    action: "alert_and_log"

  # ============================================================
  # execve 探针 — 程序执行攻击
  # ============================================================

  - name: "nsenter_escape"
    description: "检测容器内执行 nsenter 尝试逃逸到宿主机命名空间"
    attack_vector: "nsenter_escape"
    severity: "CRITICAL"
    condition:
      event_type: "execve"
      comm:
        - "nsenter"
    cve_refs:
      - "CVE-2019-5736"
      - "CVE-2022-0492"
    action: "alert_and_log"

  - name: "privileged_exec"
    description: "检测低权限容器进程执行 shell（疑似提权后操作）"
    attack_vector: "privileged_exec"
    severity: "CRITICAL"
    condition:
      event_type: "execve"
      target_path:
        - "/bin/sh"
        - "/bin/bash"
        - "/bin/dash"
    exclude:
      comm:
        - "bash"
        - "dash"
        - "runc:[2:INIT]"
        - "runc"
    cve_refs:
      - "CVE-2019-5736"
    action: "alert_and_log"

  # ============================================================
  # connect 探针 — 网络攻击
  # ============================================================

  - name: "reverse_shell"
    description: "检测容器内反向 Shell 连接（非标端口对外连接）"
    attack_vector: "reverse_shell"
    severity: "HIGH"
    condition:
      event_type: "connect"
    exclude:
      comm:
        - "dockerd"
        - "containerd"
        - "docker-proxy"
    cve_refs:
      - "T1059"
      - "T1071"
    action: "alert_and_log"

  # ============================================================
  # openat 探针 — 敏感文件访问
  # ============================================================

  - name: "sensitive_file_access"
    description: "检测容器内读取宿主机敏感文件（shadow/kcore/docker.sock）"
    attack_vector: "sensitive_file_access"
    severity: "HIGH"
    condition:
      event_type: "openat"
      target_path:
        - "/etc/shadow"
        - "/etc/passwd"
        - "/proc/kcore"
        - "/proc/kallsyms"
        - "/var/run/docker.sock"
        - "/host_etc/shadow"
        - "/host_proc/kcore"
    cve_refs:
      - "CVE-2019-5736"
    action: "alert_and_log"

  - name: "host_directory_access"
    description: "检测容器内访问宿主机挂载目录（/host_*）"
    attack_vector: "host_directory_access"
    severity: "HIGH"
    condition:
      event_type: "openat"
      target_path:
        - "/host_etc/shadow"
        - "/host_etc/passwd"
        - "/host_proc/kcore"
    cve_refs:
      - "CVE-2019-5736"
      - "CVE-2020-15257"
    action: "alert_and_log"

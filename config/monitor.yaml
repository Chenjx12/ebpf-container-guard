# 监控范围配置 — 选择要监控的容器
# Monitoring scope — choose which containers to monitor

# include: 只监控列表中的容器（支持通配符 fnmatch）；为空 = 监控所有
#   include: only monitor listed containers (wildcards supported); empty = all
include: []

# exclude: 永不监控列表中的容器（支持通配符）；exclude 优先于 include
#   exclude: never monitor listed containers (wildcards supported); takes priority
exclude: []

# 匹配依据: name = 容器名, id = 容器短 ID（12 位）
#   match target: name = container name, id = container short ID
match_by: "name"

# 网络阻断后端: iptables（用户态，可逆） | xdp（内核态，微秒级，v0.3.9）
netblock_backend: "mixed"  # xdp(入站) + iptables(出站)

# 全量行为日志（v0.3.10）：记录所有 syscall 事件到 behaviors.log
# behavior_log (v0.3.10): record ALL syscall events to behaviors.log
behavior_log: true

# 行为日志的完整性保护与保留期 (v2 取证改造)
# integrity: hash = 链式哈希(任何人可校验) | hmac = 带密钥(防重算链伪造)
#   hmac 模式需要 key 文件 (32 字节, 权限 0600)
behavior_log_integrity: hash
behavior_log_hmac_key: /etc/ebpf-guard/chain.key

# 保留天数: 普通模式 7 天; 取证模式(hmac)自动切到 90 天
behavior_log_retain_days: 7
behavior_log_retain_days_forensic: 90
